{% extends 'base.html' %}
{% block title %}Desactivar usuario{% endblock %}
{% block content %}

<h1>¿Desactivar a {{ object.username }}?</h1>
<p>El usuario no podrá loguearse, pero su historial de pedidos se conserva.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="button button-m primary-button">Confirmar</button>
</form>

{% endblock %}
